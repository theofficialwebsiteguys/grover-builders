<header class="nav" [class.scrolled]="scrolled()">
  <div class="container nav__inner">

    <!-- Logo -->
    <a routerLink="/" class="nav__logo" (click)="closeMobile()" aria-label="Grover Builders Home">
      <img src="/images/logo.png" alt="Grover Builders & Design" class="nav__logo-img"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
      <div class="nav__logo-fallback">
        <span class="nav__logo-icon">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="4" fill="#1e3a8a"/>
            <path d="M6 26V14l10-8 10 8v12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="12" y="18" width="8" height="8" stroke="white" stroke-width="2"/>
          </svg>
        </span>
        <div>
          <div class="nav__logo-name">GROVER</div>
          <div class="nav__logo-sub">BUILDERS &amp; DESIGN</div>
        </div>
      </div>
    </a>

    <!-- Desktop Nav -->
    <nav class="nav__links" role="navigation" aria-label="Main navigation">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="nav__link"
        >{{ link.label }}</a>
      }
    </nav>

    <!-- Desktop CTA -->
    <div class="nav__cta">
      <a href="tel:+15551234567" class="btn btn-primary nav__call-btn">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
        Call Now
      </a>
    </div>

    <!-- Mobile Hamburger -->
    <button
      class="nav__hamburger"
      [class.open]="mobileOpen()"
      (click)="toggleMobile()"
      aria-label="Toggle menu"
      [attr.aria-expanded]="mobileOpen()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="nav__mobile" [class.open]="mobileOpen()" role="navigation" aria-label="Mobile navigation">
    <div class="nav__mobile-inner">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="nav__mobile-link"
          (click)="closeMobile()"
        >{{ link.label }}</a>
      }
      <div class="nav__mobile-actions">
        <a href="tel:+15551234567" class="btn btn-primary btn-lg" (click)="closeMobile()">
          Call Now
        </a>
        <a href="sms:+15551234567" class="btn btn-outline btn-lg" (click)="closeMobile()">
          Text Us
        </a>
      </div>
    </div>
  </div>
</header>
